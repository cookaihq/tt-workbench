<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>保存到工作台 收件箱</title><style>body{max-width:700px;margin:60px auto;padding:24px;background:#f4f3ee;color:#262c29;font:16px/1.8 system-ui}a{display:inline-block;background:#456551;color:white;padding:12px 20px;border-radius:8px}textarea{width:100%;height:100px}h1{font-size:26px}</style><h1>把网页选区保存到收件箱</h1><p>将下面的按钮拖到浏览器书签栏。在网页选中文字后点击这个书签；没有选中文字时保存当前网页链接。</p><a href="javascript:%0A(()%20%3D%3E%20%7B%0A%20%20if%20(!%2F%5Ehttps%3F%3A%24%2F.test(location.protocol))%20%7B%20alert(%22%E8%AF%B7%E5%9C%A8%20http%20%E6%88%96%20https%20%E7%BD%91%E9%A1%B5%E4%B8%8A%E4%BD%BF%E7%94%A8%E5%89%AA%E8%97%8F%E3%80%82%22)%3B%20return%3B%20%7D%0A%20%20const%20source%20%3D%20location.href%3B%0A%20%20const%20text%20%3D%20window.getSelection()%3F.toString().trim()%20%7C%7C%20source%3B%0A%20%20%2F%2F%20Obsidian%20consumes%20%60vault%60%20and%20passes%20custom%20fields%20to%20the%20plugin.%20Its%20URI%0A%20%20%2F%2F%20decoder%20preserves%20'%2B'%20literally%2C%20so%20encode%20spaces%20as%20%2520%20rather%20than%20'%2B'.%0A%20%20const%20targetVault%20%3D%20prompt(%22%E4%BF%9D%E5%AD%98%E5%88%B0%E5%93%AA%E4%B8%AA%20Obsidian%20%E5%BA%93%EF%BC%9F%E8%AF%B7%E8%BE%93%E5%85%A5%E5%BA%93%E5%90%8D%E3%80%82%22%2C%20%22%22)%3B%0A%20%20if%20(!targetVault%3F.trim())%20return%3B%0A%20%20const%20params%20%3D%20Object.entries(%7B%20vault%3A%20targetVault.trim()%2C%20target%3A%20targetVault.trim()%2C%20title%3A%20document.title%2C%20text%2C%20source%20%7D)%0A%20%20%20%20.map((%5Bkey%2C%20value%5D)%20%3D%3E%20%60%24%7Bkey%7D%3D%24%7BencodeURIComponent(value)%7D%60).join(%22%26%22)%3B%0A%20%20const%20uri%20%3D%20%60obsidian%3A%2F%2Ftt-capture%3F%24%7Bparams%7D%60%3B%0A%20%20if%20(text.length%20%3E%2012000%20%7C%7C%20uri.length%20%3E%2024000)%20%7B%20alert(%22%E9%80%89%E5%8C%BA%E8%BF%87%E9%95%BF%EF%BC%8C%E8%AF%B7%E5%88%86%E6%AE%B5%E5%89%AA%E8%97%8F%EF%BC%8C%E6%88%96%E5%A4%8D%E5%88%B6%E5%90%8E%E5%9C%A8%E5%B7%A5%E4%BD%9C%E5%8F%B0%E4%BF%9D%E5%AD%98%E3%80%82%E5%BD%93%E5%89%8D%E5%86%85%E5%AE%B9%E6%B2%A1%E6%9C%89%E6%88%AA%E6%96%AD%E6%88%96%E4%BF%9D%E5%AD%98%E3%80%82%22)%3B%20return%3B%20%7D%0A%20%20location.href%20%3D%20uri%3B%0A%7D)()%3B%0A">保存到工作台</a><p>浏览器询问时选择打开 Obsidian。工作台会显示取得的文字、网页标题和来源；核对后点击“保存到收件箱”。原网页仍可继续浏览。</p><p>需要当前电脑已打开目标知识库并启用工作台；发起剪藏时明确填写目标库名。只保存文字和链接，不下载图片、视频或整个网页。过长选区会提示分段，不截断正文。</p><details><summary>手动添加书签</summary><p>书签名称填写“保存到工作台”，网址填写下面完整内容：</p><textarea readonly>javascript:%0A(()%20%3D%3E%20%7B%0A%20%20if%20(!%2F%5Ehttps%3F%3A%24%2F.test(location.protocol))%20%7B%20alert(%22%E8%AF%B7%E5%9C%A8%20http%20%E6%88%96%20https%20%E7%BD%91%E9%A1%B5%E4%B8%8A%E4%BD%BF%E7%94%A8%E5%89%AA%E8%97%8F%E3%80%82%22)%3B%20return%3B%20%7D%0A%20%20const%20source%20%3D%20location.href%3B%0A%20%20const%20text%20%3D%20window.getSelection()%3F.toString().trim()%20%7C%7C%20source%3B%0A%20%20%2F%2F%20Obsidian%20consumes%20%60vault%60%20and%20passes%20custom%20fields%20to%20the%20plugin.%20Its%20URI%0A%20%20%2F%2F%20decoder%20preserves%20'%2B'%20literally%2C%20so%20encode%20spaces%20as%20%2520%20rather%20than%20'%2B'.%0A%20%20const%20targetVault%20%3D%20prompt(%22%E4%BF%9D%E5%AD%98%E5%88%B0%E5%93%AA%E4%B8%AA%20Obsidian%20%E5%BA%93%EF%BC%9F%E8%AF%B7%E8%BE%93%E5%85%A5%E5%BA%93%E5%90%8D%E3%80%82%22%2C%20%22%22)%3B%0A%20%20if%20(!targetVault%3F.trim())%20return%3B%0A%20%20const%20params%20%3D%20Object.entries(%7B%20vault%3A%20targetVault.trim()%2C%20target%3A%20targetVault.trim()%2C%20title%3A%20document.title%2C%20text%2C%20source%20%7D)%0A%20%20%20%20.map((%5Bkey%2C%20value%5D)%20%3D%3E%20%60%24%7Bkey%7D%3D%24%7BencodeURIComponent(value)%7D%60).join(%22%26%22)%3B%0A%20%20const%20uri%20%3D%20%60obsidian%3A%2F%2Ftt-capture%3F%24%7Bparams%7D%60%3B%0A%20%20if%20(text.length%20%3E%2012000%20%7C%7C%20uri.length%20%3E%2024000)%20%7B%20alert(%22%E9%80%89%E5%8C%BA%E8%BF%87%E9%95%BF%EF%BC%8C%E8%AF%B7%E5%88%86%E6%AE%B5%E5%89%AA%E8%97%8F%EF%BC%8C%E6%88%96%E5%A4%8D%E5%88%B6%E5%90%8E%E5%9C%A8%E5%B7%A5%E4%BD%9C%E5%8F%B0%E4%BF%9D%E5%AD%98%E3%80%82%E5%BD%93%E5%89%8D%E5%86%85%E5%AE%B9%E6%B2%A1%E6%9C%89%E6%88%AA%E6%96%AD%E6%88%96%E4%BF%9D%E5%AD%98%E3%80%82%22)%3B%20return%3B%20%7D%0A%20%20location.href%20%3D%20uri%3B%0A%7D)()%3B%0A</textarea></details></html>
