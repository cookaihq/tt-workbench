 {id:'main',name:'全局主规则',filename:'AGENTS.md',group:'主规则',relative:'AGENTS.md',body:'# 全局 Agent 指令\n\n本文件规定本人跨项目使用 Agent 的共同要求。\n\n## 先判定需求角色\n\n- 供本人使用的产出，尊重本人明确的目标、偏好与约束。\n- 面向第三方的产出，结合目标受众的需要评价方案。\n- 对事实、可行性和目标是否达成保持独立判断。\n\n## 按需读取的规则\n\n- 提出或评估方案前，读取方案提出与评估场景。\n- 维护规则或调整加载入口前，读取 Agent 指令与项目规则维护场景。\n- 创建临时文件或复用脚本前，读取对应的存放规则。'},
 {id:'plans',name:'方案提出与评估',filename:'proposing-and-evaluating-plans.md',group:'场景规则',relative:'scenarios-agent-instructions/proposing-and-evaluating-plans.md',body:'# 方案提出与评估\n\n适用条件：提出或评估方案、整理供执行的流程，或依据用户纠正修订这类回答。\n\n## 核对目标与依据\n\n- 明确要达到的状态、完成条件和已经确认的约束。\n- 区分已确认要求、已有实现和待验证假设。\n\n## 检查完整流程\n\n从用户实际起点推演到结果，核对每一步的输入、执行方、产出及下一步如何使用。\n\n## 检查实现依据\n\n比较能够满足目标的合理路径，说明推荐依据与仍未核实的部分。'},
 {id:'maintenance',name:'Agent 指令与项目规则维护',filename:'maintaining-agent-instructions-and-project-rules.md',group:'场景规则',relative:'scenarios-agent-instructions/maintaining-agent-instructions-and-project-rules.md',body:'# Agent 指令与项目规则的维护\n\n适用条件：新增、修改、拆分或迁移规则，或调整读取与加载入口。\n\n## 确定范围与已有来源\n\n- 跨项目共同要求归入全局规则。\n- 项目专属要求仍在所属项目维护。\n- 先核对已有正文、来源和引用关系。\n\n## 组织主规则与场景\n\n主文件保留常驻要求和明确的场景读取入口。只有在特定条件下适用的详细流程放入场景文件。\n\n## 验证读取关系\n\n核对正文、触发条件、引用路径及实际加载结果。'},
 {id:'temporary',name:'临时文件与复用脚本',filename:'temporary-files-and-reusable-scripts.md',group:'场景规则',relative:'scenarios-agent-instructions/temporary-files-and-reusable-scripts.md',body:'# 临时文件与复用脚本的存放\n\n适用条件：创建临时文件、新增复用脚本，或迁移这两类文件。\n\n## 按用途选择位置\n\n先遵守当前项目已有的存放规则。没有专门约定时，临时文件按业务存放，复用脚本进入正式脚本目录。\n\n## 判断文件用途\n\n正式文档和需要长期保留的记录使用项目规定的正式位置，不因它们在执行过程中产生就当成缓存。'}
];
const localDocument={id:'local',name:'本机现有全局规则',filename:'AGENTS.md',group:'本机原文件',body:'# 本机全局 Agent 规则\n\n- GitHub 连接失败或超时时，按本机已配置的代理重试一次。\n- 自行备份时，在规定的本机目录中保存恢复材料。\n- Windows 原生环境的 uv 访问失败，按对应排障说明处理。\n\n以上内容仅用于演示本机原文件的只读浏览。'};
const urlParams=new URL(location.href).searchParams;
let variant=Object.hasOwn(variants,urlParams.get('variant'))?urlParams.get('variant'):'A';
let state={host:'codex',scenario:Object.hasOwn(examples,urlParams.get('scenario'))?urlParams.get('scenario'):'local',selectedFile:'main',refreshes:0};
let toastTimer;
const model=()=>examples[state.scenario];
const hostName=()=>state.host==='codex'?'Codex':'Claude Code';
const entry=()=>state.host==='codex'?'C:/Users/y/.codex/AGENTS.md':'C:/Users/y/.claude/CLAUDE.md';
const availableDocuments=()=>state.scenario==='local'?[...documents,localDocument]:documents;
function nav(){return `<div class="nav-label">工作空间</div>${[['grid','任务'],['folder','0. 收件箱'],['folder','1. 项目'],['folder','2. 领域'],['folder','3. 资源'],['folder','4. 存档']].map(([i,n])=>`<span class="nav-item">${icon(i)}${n}</span>`).join('')}<span class="nav-item">${icon('file')}开发 Issue</span><div class="nav-label section">系统</div><span class="nav-item active" aria-current="page">${icon('rules')}Agent 规则</span><div class="nav-foot">查看规则文件<br>了解本机链接状态</div>`;}
function header(){return `<div class="intro"><div><div class="eyebrow">TT / AGENT RULES</div><h1>Agent 规则</h1><p>浏览全局主规则与场景文件，查看本机是否接入当前项目。</p></div><div class="actions"><select id="host-select" aria-label="查看哪个 Agent"><option value="codex" ${state.host==='codex'?'selected':''}>Codex · 当前电脑</option><option value="claude" ${state.host==='claude'?'selected':''}>Claude Code · 当前电脑</option></select><button data-action="refresh">${icon('refresh')} 重新检查</button></div></div>`;}
function statusTop(){const m=model();return `<div class="status-top ${m.tone}"><span class="status-mark">${m.tone==='good'?'✓':m.tone==='neutral'?'?':'!'}</span><div class="status-copy"><h2>${m.title}</h2><p>${m.description}</p></div><span class="badge ${m.tone==='good'?'':m.tone==='error'?'error':m.tone==='neutral'?'neutral':'warn'}">${m.tone==='good'?'链接正常':m.tone==='neutral'?'无法判断':'需要处理'}</span></div>`;}
function facts(){const m=model();return `<div class="status-facts"><div class="fact"><strong>本机主规则</strong><div><div class="path">${entry()}</div>${m.mainTarget?`<small>实际目标</small><div class="path">${m.mainTarget}</div>`:'<p>'+ (m.mainType==='普通文件'?'独立保存在用户目录':m.mainType==='不存在'?'当前示例中未找到该入口':'未取得文件信息')+'</p>'}</div><span class="badge ${m.mainTarget===sourceRoot+'/AGENTS.md'?'':'neutral'}">${m.mainType}</span></div><div class="fact"><strong>当前项目正式源</strong><div class="path">${sourceRoot}/AGENTS.md</div><span class="badge neutral">期望目标</span></div><div class="fact"><strong>场景入口</strong><div><div class="path">C:/Users/y/.agents/scenarios-agent-instructions</div>${m.sceneStatus==='已链接'?`<small>实际目标</small><div class="path">${sourceRoot}/scenarios-agent-instructions</div>`:''}</div><span class="badge ${m.sceneStatus==='已链接'?'':'neutral'}">${m.sceneStatus}</span></div>${state.scenario==='override'?`<div class="fact"><strong>覆盖文件</strong><div class="path">${state.host==='codex'?'C:/Users/y/.codex/AGENTS.override.md':'宿主实际配置目录中的其他规则入口'}</div><span class="badge warn">非空文件</span></div>`:''}</div>`;}
function statusPanel(compact=false){return compact?`<section class="panel compact-status">${statusTop()}<details class="compact-details"><summary>查看入口位置与符号链接目标</summary>${facts()}<p class="small muted">链接状态不代表现有 Agent 会话已经重新加载。</p></details></section>`:`<section class="panel status-panel">${statusTop()}${facts()}<p class="status-foot">本次为示例检查。链接状态不代表现有 Agent 会话已经重新加载。</p></section>`;}
function promptText(){
 const m=model();
 const task=state.scenario==='unknown'?'当前任务：核实入口状态。\n请先核实实际配置目录和无法读取的入口，再按主规则与场景入口的实际状态确定整理或接入范围。具体操作与我确认后再执行。':
  m.mainTarget!==sourceRoot+'/AGENTS.md'?'当前任务：整理并接入主规则。\n请核实已有规则及引用，梳理不明确的条款，按项目约定提出主规则与场景规则的拆分及接入方案。展示具体条款、去向及文件／入口操作，与我确认后再写入正式源、建立或修复链接并验证读取。':
  m.sceneStatus!=='已链接'?'当前任务：补齐场景规则入口。\n主规则已经直接链接到当前项目正式源，请保留其正文与链接。核查共用场景入口、主文件引用的场景路径及必要旧内容，说明已有内容去向、拟建立或修复的场景目录链接及共用入口影响，与我确认后再执行，并验证主规则中的路径可读取场景文件。仅发现确需澄清或合并的内容时另行提出方案。':
  '当前任务：核查覆盖文件或读取问题。\n主规则与场景入口已经接入，请保留已正确接入的入口，核查覆盖文件或读取问题；涉及已有内容处置时与我确认后再执行。';
 return `$tt-organize-agent-rules\n\n当前项目：${project}\n目标 Agent：${hostName()}\n本机主入口：${entry()}\n当前观察：${m.title}；${m.mainType}${m.mainTarget?'，实际目标为 '+m.mainTarget:''}。\n共用场景入口：C:/Users/y/.agents/scenarios-agent-instructions；${m.sceneStatus}\n目标主规则：${sourceRoot}/AGENTS.md\n目标场景目录：${sourceRoot}/scenarios-agent-instructions\n\n${task}\n\n注：本提示来自交互原型，状态和规则内容为示例；新 Skill 尚未实现。`;
}
function promptCard(wide=false){if(!model().needsSkill)return '';return `<section class="panel prompt-card ${wide?'prompt-wide':''}" aria-label="调用 Skill 的提示词"><div class="panel-head"><h2>在 Agent 中处理</h2>${icon('rules')}</div><div class="panel-body"><div class="prompt-description"><p>复制提示词，在当前项目的 Agent 会话中使用 Skill。</p><p>内容判断与文件操作在会话中确认。</p></div><textarea id="skill-prompt" class="prompt-text" readonly aria-label="Skill 调用提示词">${esc(promptText())}</textarea><div class="prompt-footer"><span class="copy-status" id="copy-status">提示词可直接选中复制。</span><button class="primary" data-action="copy-prompt">${icon('copy')} 复制提示词</button></div></div></section>`;}
function fileNav(){let previous='';return `<aside class="file-nav" aria-label="规则文件列表">${availableDocuments().map(d=>{const group=d.group!==previous?`<div class="file-group">${d.group==='本机原文件'?d.group:'当前项目 · '+d.group}</div>`:'';previous=d.group;return `${group}<button class="file-button" data-action="file" data-id="${d.id}" aria-selected="${state.selectedFile===d.id}">${icon(d.id==='local'?'monitor':'file')}<span><strong>${d.name}</strong><small>${d.id==='main'?'AGENTS.md':d.id==='local'?'独立普通文件':'场景文件'}</small></span></button>`;}).join('')}<p class="file-note">正文只读展示。<br>内容由 Agent 或外部编辑器维护。</p></aside>`;}
function renderBody(body){return body.split('\n\n').map(block=>{if(block.startsWith('# '))return `<h2>${esc(block.slice(2))}</h2>`;if(block.startsWith('## '))return `<h3>${esc(block.slice(3))}</h3>`;if(block.startsWith('- '))return '<ul>'+block.split('\n').map(line=>'<li>'+esc(line.replace(/^- /,''))+'</li>').join('')+'</ul>';return '<p>'+esc(block).replace(/\n/g,'<br>')+'</p>';}).join('');}
function documentView(){const d=availableDocuments().find(x=>x.id===state.selectedFile)||documents[0];const local=d.id==='local';return `<article class="document"><div class="doc-header"><div class="row between"><h2>${d.name}</h2><span class="badge neutral">${local?'本机原文件':'当前项目 · 正式源'}</span></div><div class="path">${local?entry():sourceRoot+'/'+d.relative}</div><div class="source-note">${local?'这份文件尚未通过符号链接接入当前项目。':model().mainTarget===sourceRoot+'/AGENTS.md'?'本机主规则链接指向本项目；页面正文为原型节选。':'当前显示项目正式源，本机是否使用它见接入状态。'}</div></div><div class="doc-body">${renderBody(d.body)}</div></article>`;}
function reader(){return `<section class="browser"><div class="browse-intro"><h2>规则文件</h2><p>主规则与场景文件 · 只读浏览</p></div><div class="panel file-workspace">${fileNav()}${documentView()}</div></section>`;}
function VariantA(){return statusPanel()+`<div class="overview-grid ${model().needsSkill?'':'connected'}">${reader()}${promptCard()}</div>`;}
function VariantB(){return statusPanel(true)+`<div class="reading-grid">${reader()}<aside class="reading-aside">${promptCard()}${statusPanel()}</aside></div>`;}
function VariantC(){return `<div class="directory">${statusPanel(true)}${promptCard(true)}<div class="section-title">${icon('folder')}当前项目的规则文件</div>${availableDocuments().map((d,i)=>`<details class="file-accordion" ${i===0?'open':''}><summary>${icon(d.id==='local'?'monitor':'file')}<strong>${d.name}</strong><small>${d.id==='local'?'本机原文件':d.filename}</small></summary><div class="path">${d.id==='local'?entry():sourceRoot+'/'+d.relative}</div><div class="doc-body">${renderBody(d.body)}</div></details>`).join('')}</div>`;}
function exposeState(){const m=model();document.getElementById('state-output').textContent=JSON.stringify({layout:variant,agent:hostName(),example:state.scenario,mainEntryType:m.mainType,mainTarget:m.mainTarget,scenarioEntry:m.sceneStatus,promptVisible:m.needsSkill,selectedFile:state.selectedFile,readOnly:true,actualFilesRead:false,actualFilesModified:false},null,2);}
function render(){if(!availableDocuments().some(d=>d.id===state.selectedFile))state.selectedFile='main';document.getElementById('nav').innerHTML=nav();document.getElementById('app').innerHTML=header()+({A:VariantA,B:VariantB,C:VariantC}[variant])();document.getElementById('variant-label').innerHTML=`<strong>${variant} · ${variants[variant].name}</strong><small>${variants[variant].description} · ${Object.keys(variants).indexOf(variant)+1}/3</small>`;document.getElementById('scenario-select').value=state.scenario;exposeState();}
function changeVariant(delta){const names=Object.keys(variants);variant=names[(names.indexOf(variant)+delta+names.length)%names.length];updateUrl();render();}
function updateUrl(){const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('scenario',state.scenario);try{history.replaceState({},'',url);}catch{}}
function toast(message){const node=document.getElementById('toast');node.textContent=message;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.hidden=true,3500);}
document.addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='previous')return changeVariant(-1);if(action==='next')return changeVariant(1);if(action==='file'){state.selectedFile=button.dataset.id;render();return;}if(action==='refresh'){state.refreshes++;toast('原型保留当前示例状态；正式页面将重新读取本机链接。');return;}if(action==='copy-prompt'){const textarea=document.getElementById('skill-prompt');try{await navigator.clipboard.writeText(textarea.value);document.getElementById('copy-status').textContent='已复制，可粘贴到 Agent 会话。';}catch{textarea.focus();textarea.select();document.getElementById('copy-status').textContent='请使用复制快捷键，文本已选中。';}}});
document.addEventListener('change',event=>{if(event.target.id==='scenario-select'){state.scenario=event.target.value;updateUrl();render();}else if(event.target.id==='host-select'){state.host=event.target.value;state.scenario=state.host==='codex'?'local':'unknown';state.selectedFile='main';updateUrl();render();}});
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();changeVariant(event.key==='ArrowLeft'?-1:1);}});
render();
</script>
</body>
</html>
