function sidebar(){return `<aside class="sidebar"><div><div class="side-label">我的空间</div>${navButton('tasks','任务','task',tasks.filter(t=>['待开始','进行中'].includes(t.status)).length)}${navButton('projects','项目','folder',projects.length)}${navButton('inbox','收件箱 Inbox','layers',inboxItems.filter(i=>i.status==='待整理').length)}${navButton('notes','浏览笔记','document',businessNoteEntries().length)}<button class="nav-btn ${state.view==='tasks'&&state.scope==='独立任务'?'active':''}" data-action="standalone">${icon('document')}独立任务</button></div><div><div class="side-label">领域</div>${domains.map(d=>`<button class="nav-btn" data-action="domain" data-value="${d}"><span class="nav-dot"></span>${d}</button>${d==='企业培训'?enterpriseClients().map(c=>`<button class="nav-btn nav-sub" data-action="client" data-value="${esc(c)}">${esc(c)}</button>${projects.filter(p=>p.scope===d&&p.client===c).map(projectNav).join('')}`).join('')+projects.filter(p=>p.scope===d&&!p.client).map(projectNav).join(''):projects.filter(p=>p.scope===d).map(projectNav).join('')}`).join('')}</div><div class="sidebar-foot"><div class="side-title">先记录，再决定下一步</div><p>项目保存共同目标与资料。<br>任务保留具体进展。<br>收件箱保留尚待整理的输入。</p></div></aside>`;}
function intro(kicker,title,description,actions=''){return `<div class="page-intro"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="subtitle">${description}</p></div><div class="row wrap">${actions}<button class="btn primary" data-action="capture">${icon('plus')}随手记</button></div></div>`;}
function stats(){return `<div class="stats">${['进行中','待开始','暂停'].map(s=>`<div class="stat"><b>${tasks.filter(t=>t.status===s).length}</b><span>${s}</span></div>`).join('')}<div class="stat"><b>${projects.length}</b><span>项目</span></div></div>`;}
function domainFilters(forProjects=false){return `<select data-filter="scope" aria-label="按领域筛选">${['全部领域',...domains,...(forProjects?[]:['独立任务'])].map(x=>`<option value="${x}" ${x===state.scope?'selected':''}>${x==='独立任务'?'仅独立任务':x}</option>`).join('')}</select>${state.scope==='企业培训'?`<select data-filter="client" aria-label="按企业筛选">${['全部企业',...enterpriseClients()].map(x=>`<option value="${esc(x)}" ${x===state.client?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}`;}
function filters(){const ps=projects.filter(p=>(state.scope==='全部领域'||p.scope===state.scope)&&(state.client==='全部企业'||p.client===state.client));return `<div class="filters">${domainFilters()}<select data-filter="project" aria-label="按项目筛选"><option value="全部项目">全部项目</option>${ps.map(p=>`<option value="${p.id}" ${p.id===state.project?'selected':''}>${esc(p.title)}</option>`).join('')}</select><select data-filter="status" aria-label="按任务状态筛选">${['当前任务','全部状态',...statuses].map(x=>`<option value="${x}" ${x===state.status?'selected':''}>${x}</option>`).join('')}</select><span class="filter-caption">${filteredTasks().length} 项任务</span></div>`;}
function tasksPage(){const ts=filteredTasks();if(!ts.some(t=>t.id===state.task))state.task=ts[0]?.id;return `${intro('TASKS / 工作任务','继续手上的工作','查看进展、下一步和相关笔记，恢复这项工作的上下文。','<button class="btn" data-action="new-task">新建任务</button>')}${stats()}${filters()}<div class="split"><section class="panel task-list"><div class="panel-heading"><span>${state.status==='当前任务'?'当前任务':esc(state.status)}</span><span>${ts.length} 项</span></div>${ts.length?ts.map(taskRow).join(''):taskEmpty()}</section>${ts.length?taskDetail(currentTask()):'<div class="panel empty"><p>更换筛选条件后，可以继续查看任务。</p></div>'}</div>`;}
function filteredProjects(){return projects.filter(p=>(state.scope==='全部领域'||p.scope===state.scope)&&(state.client==='全部企业'||p.client===state.client)&&(state.projectStatus==='全部状态'||state.projectStatus==='当前项目'&&['待开始','进行中','暂停'].includes(p.status)||p.status===state.projectStatus)&&(!state.query||[p.title,p.goal,p.scope,p.client,p.direction,p.group].join(' ').toLowerCase().includes(state.query.toLowerCase())));}
function projectDetail(p){
 if(!p)return `<div class="panel empty"><h3>没有匹配的项目</h3><p>更换筛选条件，或新建一个项目。</p></div>`;
 const ts=tasks.filter(t=>t.project===p.id),ns=[...new Set(ts.flatMap(t=>t.notes))];
 return `<section class="panel project-summary"><div class="detail-header"><div class="breadcrumb">${esc([p.scope,p.client,p.direction,p.group].filter(Boolean).join(' / '))} / 项目</div><h2>${esc(p.title)}</h2><p class="detail-description">${esc(p.goal)}</p></div><div class="detail-body" style="padding-top:0">
 <form data-form="project-state" data-id="${p.id}"><div class="field"><label for="project-status">项目状态</label><select id="project-status" name="status">${taskOptions(p.status)}</select></div><div class="row between wrap"><span class="muted tiny">任务完成不会自动结束项目</span><button class="btn primary small" type="submit">保存项目状态</button></div></form>
 <hr class="section-rule"><article class="note-body"><h3>项目说明</h3><p>共同目标：${esc(p.goal)}</p><p>项目背景、方案和关联材料从这里查找；具体进展由下面各项任务记录。</p></article>
 <div class="project-counts">${statuses.filter(s=>ts.some(t=>t.status===s)).map(s=>`<span class="tag">${s} ${ts.filter(t=>t.status===s).length}</span>`).join('')}</div>
 <div class="row between wrap"><h3>项目任务 <span class="muted tiny">${ts.length} 项 · 含历史记录</span></h3><button class="btn small" data-action="new-task" data-id="${p.id}">添加任务</button></div>
 ${ts.map(t=>`<button class="related-note" data-action="project-task" data-id="${t.id}">${icon('task')}<span><strong>${esc(t.title)}</strong><small>${esc(t.next)}</small></span>${pill(t.status)}</button>`).join('')||'<p class="muted tiny">此项目尚未安排任务。</p>'}
 <h3>相关笔记</h3>${ns.map(id=>`<button class="related-note" data-action="project-note" data-id="${id}">${icon('document')}<strong>${esc(notes[id].title)}</strong>${icon('chevron')}</button>`).join('')||'<p class="muted tiny">可以在推进过程中关联资料。</p>'}
 ${state.note&&ns.includes(state.note)?`<article class="note-body panel" style="padding:17px;margin-top:14px"><h3>${esc(notes[state.note].title)}</h3>${noteContent(notes[state.note])}</article>`:''}
 <div class="placement">项目说明笔记位置<code>${esc(projectPath(p))}</code></div></div></section>`;
}
function projectsPage(){
 const ps=filteredProjects();if(!ps.some(p=>p.id===state.selectedProject))state.selectedProject=ps[0]?.id;
 let lastGroup='';
 return `${intro('PROJECTS / 项目','从项目找到目标与资料','项目状态独立记录，按领域、企业或创作方向查找。','<button class="btn" data-action="new-project">新建项目</button>')}
 <div class="filters">${domainFilters(true)}<select data-filter="projectStatus" aria-label="按项目状态筛选">${['当前项目','全部状态',...statuses].map(s=>`<option value="${s}" ${state.projectStatus===s?'selected':''}>${s}</option>`).join('')}</select><span class="filter-caption">${ps.length} 个项目</span></div>
 <div class="split"><section class="panel task-list"><div class="panel-heading"><span>项目列表</span><span>${ps.length}</span></div>${ps.map(p=>{const group=[p.scope,p.client,p.direction,p.group].filter(Boolean).join(' / '),label=lastGroup===group?'':`<div class="list-group">${esc(group)}</div>`;lastGroup=group;return label+`<button class="task-item ${state.selectedProject===p.id?'selected':''}" data-action="select-project" data-id="${p.id}"><div class="row between wrap"><div class="task-title">${esc(p.title)}</div>${pill(p.status)}</div><p class="task-progress">${esc(p.goal)}</p><div class="next-line">${tasks.filter(t=>t.project===p.id).length} 项任务</div></button>`;}).join('')||'<div class="empty">没有匹配的项目</div>'}</section>${projectDetail(projects.find(p=>p.id===state.selectedProject))}</div>`;
}

const projectOf=t=>projects.find(p=>p.id===t.project);
const contextOf=t=>{const p=projectOf(t);return p?[p.scope,p.client,p.direction,p.group,p.title].filter(Boolean).join(' / '):'独立任务';};
const taskPath=t=>{const p=projectOf(t);return p?`${projectDirectory(p)}/任务/${t.title}/任务说明.md`:`独立任务/${t.title}/任务说明.md`;};
const pill=s=>`<span class="pill ${s==='进行中'?'green':s==='待开始'?'orange':s==='暂停'?'blue':'gray'}"><span class="dot"></span>${esc(s)}</span>`;
const taskOptions=(value)=>statuses.map(s=>`<option ${s===value?'selected':''}>${s}</option>`).join('');
function filteredTasks(){return tasks.filter(t=>{const p=projectOf(t);return(state.scope==='全部领域'||(p?.scope||'独立任务')===state.scope)&&(state.client==='全部企业'||p?.client===state.client)&&(state.project==='全部项目'||t.project===state.project)&&(state.status==='全部状态'||state.status==='当前任务'&&['待开始','进行中'].includes(t.status)||t.status===state.status)&&(!state.query||[t.title,t.progress,t.next,contextOf(t)].join(' ').toLowerCase().includes(state.query.toLowerCase()));});}
function currentTask(){return tasks.find(t=>t.id===state.task)||tasks[0];}
function notice(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3500);}
function navButton(view,name,ico,count){return`<button class="nav-btn ${state.view===view?'active':''}" data-action="view" data-value="${view}">${icon(ico)}${name}<span class="count">${count}</span></button>`;}
function taskRow(t){return`<button class="task-item ${state.task===t.id?'selected':''}" data-action="task" data-id="${t.id}"><div class="row between">${pill(t.status)}<span class="muted tiny">${esc(projectOf(t)?.client||projectOf(t)?.scope||'独立任务')}</span></div><div class="task-title">${esc(t.title)}</div><div class="task-context">${esc(projectOf(t)?.title||'不属于任何项目')}</div><p class="task-progress">${esc(t.progress)}</p><div class="next-line">下一步 · ${esc(t.next)}</div></button>`;}
function taskEmpty(){return`<div class="empty">${icon('search')}<h3>没有匹配的任务</h3><p>可以换一个筛选条件，或清空搜索。</p><button class="btn small" style="margin-top:16px" data-action="clear-filters">显示当前任务</button></div>`;}
function relatedNotes(t){return t.notes.map(id=>{const n=notes[id];return`<button class="related-note" data-action="note" data-id="${id}">${icon('document')}<span><strong>${esc(n.title)}</strong><small>${esc(n.label)}</small></span>${icon('chevron')}</button>`;}).join('');}
function agentPrompt(t){return`请核查是否有 Agent 正在执行以下任务。\n\n任务：${t.title}\n任务笔记：${taskPath(t)}\n当前记录：${t.status}；${t.progress}\n\n请先说明本会话能访问哪些 Agent 应用、会话或执行记录，再根据实际证据核查与此任务的关联。不要把笔记中的“进行中”或本机存在进程当作执行证据。\n如能确认，请列出 Agent / 会话、最近活动和证据来源；无法访问或证据不足时明确写“无法确认”。不要启动、停止或修改任务，不要访问私人库。`;}
function taskDetail(t){if(!t)return taskEmpty();let body='';if(state.tab==='overview'){body=`<form data-form="task" data-id="${t.id}"><div class="field"><label for="task-status">任务状态</label><select id="task-status" name="status">${taskOptions(t.status)}</select></div><div class="field"><label for="task-progress">当前进度</label><textarea id="task-progress" name="progress" rows="3" required>${esc(t.progress)}</textarea></div><div class="field"><label for="task-next">下一步</label><textarea id="task-next" name="next" rows="2" required>${esc(t.next)}</textarea></div><div class="row between"><span class="muted tiny">任务进度与 Agent 运行状态分别记录</span><button class="btn primary small" type="submit">保存修改</button></div></form><hr class="section-rule"><article class="note-body"><h3>希望得到的结果</h3><p>${esc(t.goal)}</p>${taskInboxSources(t)}<h3>已完成的工作</h3>${t.done.length?`<ul>${t.done.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>尚未开始执行。</p>'}<h3>当前问题</h3><p>${esc(t.question)}</p></article><div class="placement">说明笔记位置<code>${esc(taskPath(t))}</code></div>`;}else if(state.tab==='notes'){const n=notes[state.note];body=n?`<button class="mini-link" data-action="note-back">← 相关笔记列表</button><div class="note-title-row" style="margin-top:18px">${icon('document')}<h3>${esc(n.title)}</h3></div><article class="note-body">${noteContent(n)}</article>`:`<p class="muted" style="font-size:12px;margin-bottom:15px">选中一份笔记，直接在这里阅读。</p>${relatedNotes(t)}`;}else{body=`<div class="inline-message">Agent 运行状态：尚未查询。<br>复制以下 Prompt，在你新开的 Agent 会话中核查。</div><div class="field"><label for="agent-prompt">查询 Prompt</label><textarea class="prompt" id="agent-prompt" readonly>${esc(agentPrompt(t))}</textarea></div><button class="btn primary" data-action="copy-prompt">${icon('copy')}复制查询 Prompt</button><p class="muted" style="font-size:11px;margin-top:15px">查询结果取决于新会话可访问的记录。没有证据时应报告“无法确认”。</p>`;}return`<section class="panel task-detail"><div class="detail-header"><div class="breadcrumb">${esc(contextOf(t))}</div>${t.project?`<button class="mini-link" data-action="open-project" data-id="${t.project}">查看所属项目 →</button>`:""}<h2>${esc(t.title)}</h2><div class="row wrap">${pill(t.status)}<span class="muted tiny">${esc(projectOf(t)?.client||'个人工作')}</span></div></div><nav class="tabs" aria-label="任务详情标签">${[['overview','任务说明'],['notes',`相关笔记 ${t.notes.length}`],['agent','查询 Agent']].map(([key,name])=>`<button class="tab ${state.tab===key?'active':''}" data-action="tab" data-value="${key}">${name}</button>`).join('')}</nav><div class="detail-body">${body}</div></section>`;}

function inboxInstant(i){
 if(!i.created||!i.created_timezone)return NaN;
 return Date.parse(i.created.replace(' ','T')+i.created_timezone);
}
function readingTimeZone(){return Intl.DateTimeFormat().resolvedOptions().timeZone;}
function inboxDisplayTime(i){
 const instant=inboxInstant(i);
 if(!Number.isFinite(instant))return '时间或时区未填写';
 return new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZoneName:'shortOffset'}).format(new Date(instant));
}
function captureCreatedTime(){
 const now=new Date(),pad=n=>String(n).padStart(2,'0'),offset=-now.getTimezoneOffset(),minutes=Math.abs(offset);
 return {created:`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,created_timezone:`${offset<0?'-':'+'}${pad(Math.floor(minutes/60))}:${pad(minutes%60)}`};
}
function newestInboxFirst(a,b){
 const first=inboxInstant(a),second=inboxInstant(b);
 if(!Number.isFinite(first))return Number.isFinite(second)?1:0;
 if(!Number.isFinite(second))return -1;
 return second-first;
}
function filteredInbox(){return inboxItems.filter(i=>(state.inboxFilter==='全部记录'||i.status===state.inboxFilter)&&(!state.query||[i.title,i.raw,i.thoughts,i.channel,...i.sources].join(' ').toLowerCase().includes(state.query.toLowerCase()))).sort(newestInboxFirst);}
function inboxDetail(i){if(!i)return `<div class="panel empty"><h3>这里暂时没有记录</h3><p>可以查看其他状态，或随手记下新的内容。</p></div>`;return `<section class="panel"><div class="detail-header"><div class="breadcrumb">收件箱 / ${esc(inboxDisplayTime(i))} / ${esc(i.channel)}</div><h2>${esc(i.title)}</h2><span class="pill ${i.status==='待整理'?'orange':'gray'}">${i.status}</span><p class="detail-description">创建时记录：${esc(i.created||'时间未填写')} ${i.created_timezone?'UTC'+esc(i.created_timezone):'时区未填写'}</p></div><div class="detail-body" style="padding-top:0"><div class="field-label">当时记下的内容</div><div class="raw-input">${esc(i.raw)}</div><div class="field-label">来源与材料</div>${i.sources.length?i.sources.map(s=>`<div class="source-entry">${icon('document')} ${esc(s)}</div>`).join(''):`<p class="muted tiny" style="margin-bottom:18px">${i.channel==='工作台随手记'?'尚未单独整理来源信息；原始输入保留在上方。':'自己的想法，没有外部来源。'}</p>`}<form data-form="inbox" data-id="${i.id}"><div class="field"><label for="inbox-thoughts">自己的补充（选填）</label><textarea id="inbox-thoughts" name="thoughts" rows="4" placeholder="想到了什么、还有什么疑问，都可以自由记录。">${esc(i.thoughts)}</textarea></div><button class="btn small" type="submit">保存补充</button></form><hr class="section-rule"><div class="field-label">关联已有项目（选填）</div><p class="muted tiny" style="margin-bottom:9px">这里仅添加项目关联；需要推进时，可以在下方创建或关联任务。</p>${i.related.map(id=>`<button class="related-note" data-action="open-project" data-id="${id}">${icon('folder')}<strong>${esc(projects.find(p=>p.id===id)?.title||id)}</strong>${icon('chevron')}</button>`).join('')}<form data-form="link-project" data-id="${i.id}" class="row wrap"><select name="projectId" aria-label="选择要关联的已有项目"><option value="">选择已有项目</option>${projects.filter(p=>!i.related.includes(p.id)).map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select><button class="btn small" type="submit">添加关联</button></form><hr class="section-rule">${inboxTaskLinks(i)}<hr class="section-rule"><div class="pending-note">整理后保留原记录，可以随时找回。</div><button class="btn ${i.status==='待整理'?'primary':''}" data-action="inbox-status" data-id="${i.id}" data-value="${i.status==='待整理'?'已整理':'待整理'}">${icon('check')}${i.status==='待整理'?'标为已整理':'重新放回待整理'}</button><p class="muted tiny" style="margin-top:11px">“已整理”表示已看过并决定如何保留；原记录仍可查找，不要求创建任务。</p></div></section>`;}
function inboxPage(){const items=filteredInbox();if(!items.some(i=>i.id===state.inbox))state.inbox=items[0]?.id;return `${intro('INBOX / 收件箱','先记下，稍后整理','一句话、一个链接、一段摘录，都可以从这里开始。')}<div class="inline-message proposal-banner"><span>已确认：接收未确定归属的输入；已整理记录保留，默认只显示待整理。</span><a href="inbox-proposal.md" target="_blank" rel="noopener">阅读完整讨论稿 ↗</a></div><p class="muted tiny time-context">显示时区：${esc(readingTimeZone())} · 按创建时间倒序，详情保留原始时间</p><div class="filters inbox-filters">${['待整理','已整理','全部记录'].map(s=>`<button class="${state.inboxFilter===s?'active':''}" data-action="inbox-filter" data-value="${s}">${s}${s==='全部记录'?'':` ${inboxItems.filter(i=>i.status===s).length}`}</button>`).join('')}<span class="filter-caption">${items.length} 条记录</span></div><div class="split"><section class="panel task-list"><div class="panel-heading"><span>${state.inboxFilter}</span><span>${items.length} 条</span></div>${items.map(i=>`<button class="task-item inbox-row ${state.inbox===i.id?'selected':''}" data-action="inbox-item" data-id="${i.id}"><div class="row between"><span class="tiny muted">${esc(i.channel)}</span><span class="tiny muted">${esc(inboxDisplayTime(i))}</span></div><div class="task-title">${esc(i.title)}</div><p class="task-progress">${esc(i.raw)}</p><div class="next-line">${i.sources.length?i.sources.length+' 条来源记录':i.channel==='工作台随手记'?'来源信息待整理':'自己的想法'}${i.related.length?' · 已关联项目':''}${i.relatedTasks?.length?' · 已关联任务':''}</div></button>`).join('')||'<div class="empty">没有符合条件的记录</div>'}</section>${inboxDetail(inboxItems.find(i=>i.id===state.inbox))}</div>`;}
function VariantA(){return `<div class="shell">${sidebar()}<main class="workspace">${({tasks:tasksPage,projects:projectsPage,inbox:inboxPage,notes:notesPage}[state.view])()}</main></div>`;}

function helpDialog(){const d=$('#help-dialog');d.innerHTML=`<div class="modal-head"><h2 id="help-heading">布局 A · 本轮讨论内容</h2><button class="icon-btn" data-action="close" data-target="help-dialog" aria-label="关闭原型说明">${icon('close')}</button></div><div class="modal-body note-body"><h3>已经确定</h3><p>保留布局 A，列表与详情并排。项目和任务各自维护五种状态；任务完成不自动结束项目。笔记在详情中阅读；查询 Agent 通过复制 Prompt 完成。</p><h3>本轮修订</h3><p>增加项目状态和筛选、新建项目、新建项目内或独立任务。从 Inbox 可以明确创建或关联任务，原记录和整理状态保留。浏览笔记支持目录浏览、搜索及正文预览；所有操作仍只修改演示数据。</p><h3>已确认的收件箱规则</h3><p>采用“领域”表示持续开展的活动。未确定归属的内容进入收件箱；已明确归属的内容可以直接保存到对应课程、项目或任务。整理后保留原记录，通过状态筛选查看；不要求每条记录都生成新笔记或任务。一条记录可以包含围绕同一件事保存的多个来源及想法。本人在收件箱目录直接新建 Markdown 并应用模板；程序／Skill 可以按月创建条目文件夹，两者都作为记录展示。AI 完成摘要或解析不自动标为已整理，只有本人或明确获授权的 Agent 才能标记。模板记录创建时间及所用时区；列表按当前阅读设备时区显示并按实际时刻排序，详情保留原始时间与时区。普通附件默认按 Obsidian 设置保存，用户在 Agent 中明确指定位置时按指令保存。</p><h3>可以试用</h3><ul><li>点击“项目”，或从领域与企业下进入一个项目。</li><li>从项目打开任务，再通过“查看所属项目”返回。</li><li>新建项目或任务，选择归属并填写目标。</li><li>进入“浏览笔记”，逐层浏览文件夹或搜索笔记正文。</li><li>点击“随手记”，只填一句话或链接即可保存。</li><li>给收件箱记录补充想法、关联已有项目或任务、标为已整理，再从已整理中找回。</li></ul><h3>原型边界</h3><p>全部是示例数据，只保存在内存。没有读写真实笔记、下载来源、启动 Agent 或连接 FNS。Inbox 的两种保存结构、记录划分、状态修改权限、带时区的最小模板及附件存放原则已经确定。时间展示已按确认方案在示例数据中演示；来源字段与实际接入仍待设计。尚未读取真实笔记、接入正式模板或实现附件写入。</p><p><a href="inbox-proposal.md" target="_blank" rel="noopener">阅读 Inbox 的输入、目录与读取规则提案 →</a></p></div>`;d.showModal();}

function creationError(message){const el=$('#create-error');el.textContent=message;el.hidden=false;}
function validSegment(name){return Boolean(name)&&!['.','..'].includes(name)&&!/[\/\\\u0000-\u001f\u007f]/.test(name);}
function createProject(f){
 const scope=String(f.get('scope')||''),kind=String(f.get('kind')||''),title=String(f.get('title')||'').trim(),goal=String(f.get('goal')||'').trim(),group=String(f.get('group')||'').trim();
 if(!domains.includes(scope)||!title||!goal){creationError('请选择领域，填写项目名称与目标。');return;}
 const enterprise=scope==='企业培训',shared=enterprise&&kind==='通用内容开发';
 if(enterprise&&!['企业交付','通用内容开发'].includes(kind)){creationError('请选择企业交付或通用培训内容开发。');return;}
 if((enterprise&&!shared||scope==='内容创作')&&!group){creationError(enterprise?'请填写企业名称。':'请填写创作方向。');return;}
 if(!validSegment(title)||!shared&&group&&!validSegment(group)){creationError('名称不能是 . 或 ..，也不能包含斜杠、反斜杠或控制字符。');return;}
 if(scope==='内容创作'&&group==='账号'||scope==='社群运营'&&group==='项目'){creationError('该分组名称已用于功能目录，请使用其他名称。');return;}
 const p={id:'p'+nextId,scope,title,goal,status:'待开始',client:enterprise&&!shared?group:'',direction:scope==='内容创作'?group:'',group:scope==='社群运营'?group:''};
 if(projects.some(x=>projectDirectory(x).normalize('NFC').toLowerCase()===projectDirectory(p).normalize('NFC').toLowerCase())){creationError('此位置已有同名项目，请修改名称或分组。');return;}
 nextId++;projects.push(p);$('#create-dialog').close();openProject(p.id);notice('演示项目已创建。');
}

function createTask(f,sourceInboxId){
 const project=String(f.get('project')||''),title=String(f.get('title')||'').trim(),goal=String(f.get('goal')||'').trim(),i=inboxItems.find(x=>x.id===sourceInboxId);
 if(!title||!goal){creationError('请填写任务名称与希望得到的结果。');return;}
 if(!validSegment(title)){creationError('任务名称不能是 . 或 ..，也不能包含斜杠、反斜杠或控制字符。');return;}
 if(project&&!projects.some(p=>p.id===project)||sourceInboxId&&!i){creationError('没有找到所选项目或来源记录，请重新打开创建窗口。');return;}
 const t={id:'t'+nextId,project:project||null,title,goal,status:'待开始',progress:'尚未开始。',next:'尚未填写。',notes:[],done:[],question:'尚未记录。',inboxSources:[]};
 if(tasks.some(x=>taskPath(x).normalize('NFC').toLowerCase()===taskPath(t).normalize('NFC').toLowerCase())){creationError('此位置已有同名任务，请修改名称或归属。');return;}
 nextId++;tasks.push(t);if(i)linkInboxTask(i,t);
 $('#create-dialog').close();openTask(t.id);notice(i?'已创建演示任务并关联原记录，整理状态保留。':'演示任务已创建。');
}
function linkInboxTask(i,t){
 if(!i.relatedTasks)i.relatedTasks=[];
 if(!t.inboxSources)t.inboxSources=[];
 if(!i.relatedTasks.includes(t.id))i.relatedTasks.push(t.id);
 if(!t.inboxSources.includes(i.id))t.inboxSources.push(i.id);
}

 return `收件箱/${month}/${i.id}/记录.md`;
}
inboxItems.find(i=>i.id==='i2').path='收件箱/一段视频的开场顺序.md';
inboxItems.find(i=>i.id==='i3').path='收件箱/课程学习时记下的一句话.md';
function businessNoteEntries(){
 const entries=[...sampleBusinessNotes];
 for(const p of projects)entries.push({id:'project-'+p.id,title:p.title+' · 项目说明',path:projectPath(p),record:'project',ref:p.id,body:`<h3>项目状态</h3><p>${esc(p.status)}</p><h3>目标</h3><p>${esc(p.goal)}</p><p>项目状态由本人或获授权的 Agent 明确更新，任务完成不会自动改变项目状态。</p>`});
 for(const t of tasks)entries.push({id:'task-'+t.id,title:t.title+' · 任务说明',path:taskPath(t),record:'task',ref:t.id,body:`<h3>任务状态</h3><p>${esc(t.status)}</p><h3>希望得到的结果</h3><p>${esc(t.goal)}</p><h3>当前进度</h3><p>${esc(t.progress)}</p><h3>下一步</h3><p>${esc(t.next)}</p>${taskInboxSources(t)}`});
 for(const i of inboxItems)entries.push({id:'inbox-'+i.id,title:i.title,path:inboxPath(i),record:'inbox',ref:i.id,body:`<h3>当时记下的内容</h3><div class="raw-input">${esc(i.raw)}</div><h3>来源与材料</h3>${i.sources.length?`<ul>${i.sources.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:'<p>尚未单独整理来源信息。</p>'}<h3>自己的补充</h3><p>${esc(i.thoughts||'尚未补充。')}</p><h3>整理状态</h3><p>${esc(i.status)}</p><p class="source-line">原始创建时间：${esc(i.created||'时间未填写')} ${i.created_timezone?'UTC'+esc(i.created_timezone):'时区未填写'}</p>`});
 const contexts={n1:'p1',n2:'p1',n3:'p2',n4:'p3',n5:'p4'};
 for(const [id,n] of Object.entries(notes)){
  const p=projects.find(p=>p.id===contexts[id]),t=tasks.find(t=>t.id==='t6');
  const path=p?`${projectDirectory(p)}/${n.title}.md`:`${taskPath(t).slice(0,-'任务说明.md'.length)}${n.title}.md`;
  entries.push({id:'related-'+id,title:n.title,path,body:n.body});
 }
 return entries.map(n=>({...n,searchText:[n.title,n.path,n.body.replace(/<[^>]*>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&')].join(' ').toLowerCase()}));
}
function notesPage(){
 const all=businessNoteEntries(),prefix=state.folder?state.folder+'/':'',query=state.query.trim().toLowerCase();
 const within=all.filter(n=>n.path.startsWith(prefix)),shown=within.filter(n=>query?n.searchText.includes(query):!n.path.slice(prefix.length).includes('/'));
 const folders=query?[]:[...new Set(within.map(n=>n.path.slice(prefix.length)).filter(p=>p.includes('/')).map(p=>p.split('/')[0]))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
 const selected=all.find(n=>n.id===state.businessNote);
 const parts=state.folder?state.folder.split('/'):[];
 const breadcrumbs=`<button class="mini-link" data-action="browse-folder" data-value="">当前库</button>${parts.map((part,index)=>`<span class="muted">/</span><button class="mini-link" data-action="browse-folder" data-value="${esc(parts.slice(0,index+1).join('/'))}">${esc(part)}</button>`).join('')}`;
 return `${intro('NOTES / 浏览笔记','从目录查找与阅读','资料、知识、选题和工作记录，都可以在这里浏览。')}<div class="browser-breadcrumb">${breadcrumbs}</div><p class="muted tiny" style="margin-bottom:14px">搜索范围：${state.folder?esc(state.folder)+' 及其子目录':'当前库的全部示例业务笔记'} · 搜索标题、路径和正文</p>
 <div class="split"><section class="panel task-list"><div class="panel-heading"><span>${query?'搜索结果':state.folder?esc(parts[parts.length-1]):'当前库'}</span><span>${query?shown.length+' 篇笔记':folders.length+' 个文件夹 · '+shown.length+' 篇笔记'}</span></div>
 ${folders.map(folder=>`<button class="task-item folder-row" data-action="browse-folder" data-value="${esc(prefix+folder)}">${icon('folder')}<strong>${esc(folder)}</strong>${icon('chevron')}</button>`).join('')}
 ${shown.map(n=>`<button class="task-item ${state.businessNote===n.id?'selected':''}" data-action="business-note" data-id="${n.id}"><div class="row">${icon('document')}<strong>${esc(n.title)}</strong></div><div class="tiny muted note-path" style="margin-top:7px">${esc(n.path)}</div></button>`).join('')}
 ${!folders.length&&!shown.length?'<div class="empty">没有找到笔记。可以更换搜索内容或返回上层目录。</div>':''}</section>
 ${selected?`<section class="panel"><div class="detail-header"><div class="breadcrumb">${esc(selected.path)}</div><h2>${esc(selected.title)}</h2>${selected.record?`<button class="mini-link" data-action="open-${selected.record}" data-id="${selected.ref}">打开${{project:'项目',task:'任务',inbox:'收件箱记录'}[selected.record]} →</button>`:''}</div><div class="detail-body" style="padding-top:0"><article class="note-body">${selected.body}</article><div class="placement">示例笔记位置<code>${esc(selected.path)}</code></div></div></section>`:'<section class="panel empty"><h3>选择一份笔记，在这里阅读</h3><p>可以逐层打开文件夹，也可以搜索标题、路径或正文。</p><p>目录和内容均为示例；知识分类由你按自己的偏好决定。</p></section>'}</div>`;
}


document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;
 if(a==='view'){resetScope();state.view=v;render();return;}
 if(a==='domain'||a==='client'){resetScope();state.view='projects';state.scope=a==='domain'?v:'企业培训';state.client=a==='client'?v:'全部企业';render();return;}
 if(a==='standalone'){resetScope();Object.assign(state,{view:'tasks',scope:'独立任务',status:'全部状态'});render();return;}
 if(a==='open-project'){openProject(id);return;}
 if(a==='new-project'){projectDialog();return;}
 if(a==='new-task'){taskDialog(id||(state.project!=='全部项目'?state.project:''));return;}
 if(a==='inbox-new-task'){taskDialog('',id);return;}
 if(a==='open-inbox'){openInbox(id);return;}
 if(a==='browse-folder'){state.folder=v||'';state.businessNote=null;state.query='';render();return;}
 if(a==='business-note'){const n=businessNoteEntries().find(n=>n.id===id);if(!n)return;const prefix=state.folder?state.folder+'/':'';if(!n.path.startsWith(prefix)||!state.query&&n.path.slice(prefix.length).includes('/')){state.folder=n.path.slice(0,n.path.lastIndexOf('/'));state.query='';}state.businessNote=id;render();return;}
 if(a==='select-project'){state.selectedProject=id;state.note=null;render();return;}
 if(a==='project-note'){state.note=id;render();return;}
 if(a==='project-task'||a==='open-task'){openTask(id);return;}
 if(a==='task'){Object.assign(state,{task:id,tab:'overview',note:null});render();return;}
 if(a==='tab'){state.tab=v;state.note=null;render();return;}
 if(a==='note'){state.tab='notes';state.note=id;render();return;}
 if(a==='note-back'){state.note=null;render();return;}
 if(a==='capture'){captureDialog();return;}
 if(a==='help'){helpDialog();return;}
 if(a==='close'){$('#'+b.dataset.target).close();return;}
 if(a==='inbox-item'){state.inbox=id;render();return;}
 if(a==='inbox-filter'){state.inboxFilter=v;render();return;}
 if(a==='inbox-status'){inboxItems.find(i=>i.id===id).status=v;render();notice(v==='已整理'?'已从待整理列表移出；可在已整理中找到原记录。':'已重新放回待整理列表。');return;}
 if(a==='clear-filters'){resetScope();state.status='当前任务';render();return;}
 if(a==='copy-prompt'){try{await navigator.clipboard.writeText(agentPrompt(currentTask()));notice('查询 Prompt 已复制，可粘贴到新开的 Agent 会话。');}catch{const input=$('#agent-prompt');input.focus();input.select();notice('请复制已选中的 Prompt 文本。');}return;}
});
document.addEventListener('input',e=>{if(e.target.id==='global-search'){state.query=e.target.value;render();}});
document.addEventListener('change',e=>{if(e.target.id==='new-project-domain'||e.target.id==='new-project-kind'){updateProjectGroup();return;}const f=e.target.dataset.filter;if(!f)return;state[f]=e.target.value;state.note=null;if(f==='scope'){state.client='全部企业';state.project='全部项目';}if(f==='client')state.project='全部项目';render();});
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const f=new FormData(form),type=form.dataset.form;
 if(type==='new-project'){createProject(f);return;}
 if(type==='new-task'){createTask(f,form.dataset.source);return;}
 if(type==='project-state'){const p=projects.find(x=>x.id===form.dataset.id);if(!p||!statuses.includes(f.get('status')))return;p.status=f.get('status');state.projectStatus='全部状态';render();notice('项目状态已更新，任务状态保持各自记录。');return;}
 if(type==='link-task'){const i=inboxItems.find(x=>x.id===form.dataset.id),t=tasks.find(x=>x.id===f.get('taskId'));if(!i||!t){notice('请先选择已有任务。');return;}linkInboxTask(i,t);render();notice('已关联任务，原记录及整理状态保留。');return;}
 if(type==='task'){const t=tasks.find(x=>x.id===form.dataset.id);t.status=f.get('status');t.progress=f.get('progress').trim();t.next=f.get('next').trim();render();notice('演示任务已更新。历史任务仍可通过状态筛选查看。');}
 if(type==='inbox'){inboxItems.find(i=>i.id===form.dataset.id).thoughts=f.get('thoughts').trim();render();notice('已保存补充，当时记下的内容保持原样。');}
 if(type==='link-project'){const id=f.get('projectId'),i=inboxItems.find(i=>i.id===form.dataset.id);if(!projects.some(p=>p.id===id)){notice('请先选择一个已有项目。');return;}if(!i.related.includes(id))i.related.push(id);render();notice('已关联已有项目，没有创建任务。');}
 if(type==='new-capture'){const raw=f.get('raw').trim();if(!raw){notice('先写下一句话、链接或摘录。');return;}const i={id:'i'+nextId++,title:f.get('title').trim()||raw.slice(0,32),raw,channel:'工作台随手记',...captureCreatedTime(),status:'待整理',sources:[],thoughts:'',related:[]};inboxItems.unshift(i);$('#capture-dialog').close();Object.assign(state,{view:'inbox',inbox:i.id,inboxFilter:'待整理',query:''});render();notice('已保存一条演示输入，没有创建项目或任务。');}
});
render();

</script>
