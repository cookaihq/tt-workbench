  if(!state.sourceValid)return {title:'权威版本暂不可用',tone:'red',description:'来源配置在发布后发生变化，需要来源设备重新发布。',action:'source-info',label:'查看原因'};
  if(!received())return {title:'有新发布的配置',tone:'amber',description:'先从 Git 接收版本，再比较与本机的差异。',action:'check',label:'检查更新'};
  if(localDirty()&&current().applied!==authority().version)return {title:'两端都有配置修改',tone:'amber',description:'本机有未发布修改，同时收到了新的权威版本。',action:'conflict',label:'比较并选择'};
  if(localDirty())return {title:'本机有未发布修改',tone:'amber',description:'发布后，其他设备可以接收并应用这份配置。',action:'publish',label:'发布本机配置'};
  if(current().applied!==authority().version||changeCount())return {title:'有新版本可应用',tone:'amber',description:`权威版本 v${authority().version} 已接收，共有 ${changeCount()} 处规则变化。`,action:'apply',label:'查看并应用更新'};
  return {title:'本机与权威版本一致',tone:'green',description:`已应用 v${authority().version}，本机 FNS 已重新加载。`,action:'check',label:'检查更新'};
}
function sidebar(){
  const items=[['tasks','任务','task'],['inbox','0.收件箱','inbox'],['projects','1.项目','folder'],['areas','2.领域','compass'],['resources','3.资源','book'],['archives','4.存档','archive'],['notes','全部笔记','file'],['issues','开发 Issue','issue']];
  $('#sidebar').innerHTML=`<div class="space-group"><div class="side-label">我的空间</div>${items.map(([id,title,symbol])=>`<button class="nav-btn" data-nav="${id}" aria-current="${view===id?'page':'false'}">${icon(symbol)}${title}</button>`).join('')}</div><div class="system-group"><div class="side-label">系统</div><button class="nav-btn" data-nav="fns" aria-current="${view==='fns'?'page':'false'}">${icon('sync')}<span>FNS 配置同步</span>${status().tone!=='green'?'<span class="nav-badge">1</span>':''}</button></div><div class="sidebar-foot"><strong>先记录，再决定下一步</strong>项目保存共同目标与资料。<br>系统设置维护当前设备的环境。</div>`;
}
function intro(){return `<div class="page-intro"><div><div class="eyebrow">系统 / 配置同步</div><h1>FNS 配置同步</h1><p class="subtitle">让各台设备使用一致的同步规则，各自保留连接与身份。</p><div class="device-caption row">${icon(current().icon,'small-icon')}<span>${esc(current().name)} · 本机</span>${badge(current().os,'gray')}</div></div><div class="page-actions">${button('设备检查','checks',{name:'shield'})}${button('检查更新','check',{name:'sync'})}${button('发布本机配置','publish',{name:'upload',disabled:!current().linked})}</div></div>`;}
function checkList(){return `<div class="check-list"><div class="check-row">${icon('circle')}FNS 已安装并启用<small>2.4.0</small></div><div class="check-row">${icon('circle')}本机身份已识别<small>设备 ${state.device}</small></div><div class="check-row ${current().linked?'':'warn'}">${icon(current().linked?'circle':'issue')}配置文件与符号链接<small>${current().linked?'正常':'待归位'}</small></div><div class="check-row ${state.online?'':'warn'}">${icon(state.online?'circle':'issue')}Git 远端连接<small>${state.online?'可用':'暂不可达'}</small></div></div>`;}
function inlineDiff(from=current().rules,to=authority().rules){let any=false;const html=fields.map(f=>{const d=changes(f.key,from,to);if(!d.add.length&&!d.remove.length)return '';any=true;return `<div class="inline-diff-row"><h3>${f.title}</h3>${d.add.map(v=>`<div class="inline-change add">＋ ${esc(v)}</div>`).join('')}${d.remove.map(v=>`<div class="inline-change remove">− ${esc(v)}</div>`).join('')}</div>`;}).join('');return any?`<div class="inline-diff">${html}</div>`:`<div class="empty-diff">${icon('circle')}<p>这 4 组配置没有差异。</p></div>`;}
function fieldComparison(){if(!received())return `<div class="empty-diff">${icon('download')}<p>接收权威版本后显示配置差异。</p><div style="margin-top:15px">${button('接收更新','check',{primary:true})}</div></div>`;const f=fields.find(f=>f.key===field),d=changes(field);const column=(title,items,side)=>`<div class="diff-col"><div class="diff-caption">${icon(side==='local'?current().icon:'branch','small-icon')}${title}</div>${items.map(v=>{const changed=(side==='local'?d.remove:d.add).includes(v);return `<div class="diff-line ${changed?(side==='local'?'remove':'add'):''}"><span class="line-sign">${changed?(side==='local'?'−':'＋'):'·'}</span><span>${esc(v)}</span></div>`;}).join('')||'<p class="tiny muted">未设置规则</p>'}</div>`;return `<div class="diff-heading"><h2>${f.title}</h2><p>${f.description}</p></div><div class="diff-columns">${column('本机配置',current().rules[field],'local')}${column('权威版本 v'+authority().version,authority().rules[field],'remote')}</div><div class="diff-bottom">${d.add.length||d.remove.length?`新增 ${d.add.length} 条，移除 ${d.remove.length} 条。`:'此项无变化。'}${field==='extensions'&&d.remove.includes('.pdf')?' 应用后，PDF 将不再按类型排除。':''}</div>`;}
function comparisonPage(){const s=status();return `${intro()}<div class="compare-top"><div class="compare-context row">${icon(current().icon)}<span>本机 <b>${current().applied?'v'+current().applied:'未接入'}</b></span>${icon('arrow','small-icon')}<span>权威版本 <b>v${authority().version}</b></span></div>${badge(s.title,s.tone)}</div><div class="compare-layout"><div class="field-nav" role="tablist" aria-label="配置分组">${fields.map(f=>{const d=changes(f.key),n=d.add.length+d.remove.length;return `<button role="tab" aria-selected="${field===f.key}" data-field="${f.key}"><strong>${f.title}</strong><small>${received()?(n?n+' 处变化':'与权威版本一致'):'接收后比较'}</small></button>`;}).join('')}</div><section class="diff-pane" aria-live="polite">${fieldComparison()}</section></div><div class="compare-footer"><p>${s.description}<br>权威来源：${esc(state.devices[authority().source].name)} · ${authority().time}</p><div class="row">${button('设备检查','checks',{name:'shield'})}${button(s.label,s.action,{primary:true,name:'arrow'})}</div></div><div class="scope-note">同步范围固定为上述四组。应用时将保存恢复记录，账号与其他设备专属配置沿用本机设置。</div>`;}
function controls(){
  $('#controls').innerHTML=`<span class="selected-layout">C · 差异工作区</span><span class="control-divider first-divider"></span><div class="device-toggle" aria-label="切换演示设备"><button data-device="A" aria-pressed="${state.device==='A'}">设备 A</button><button data-device="B" aria-pressed="${state.device==='B'}">设备 B</button></div><label class="scenario-control"><span class="control-label">场景</span><select id="scenario" aria-label="演示场景">${Object.entries(scenarioNames).map(([id,name])=>`<option value="${id}" ${state.scenario===id?'selected':''}>${name}</option>`).join('')}</select></label><span class="control-divider last-divider"></span><button class="text-control" data-action="reset">重置</button><button class="text-control" data-action="state">状态</button>`;
}
function render(){
  sidebar();controls();
  if(view==='fns')$('#main').innerHTML=comparisonPage();
  else{const labels={tasks:'任务',inbox:'0.收件箱',projects:'1.项目',areas:'2.领域',resources:'3.资源',archives:'4.存档',notes:'全部笔记',issues:'开发 Issue'};$('#main').innerHTML=`<div class="page-intro"><div><div class="eyebrow">我的空间</div><h1>${labels[view]}</h1></div></div><section class="card skeleton-page">${icon('book')}<h2>这里保留现有工作台内容</h2><p>本次原型展示新增的“系统”分组与 FNS 配置同步页面。</p><div>${button('进入 FNS 配置同步','open-fns',{name:'sync',primary:true})}</div></section>`;}
  console.info('[FNS prototype state]',JSON.stringify({layout,view,state}));
}
function notify(message){clearTimeout(toastTimer);$('#toast').textContent=message;toastTimer=setTimeout(()=>{$('#toast').textContent='';},3800);}
function dialog(title,description,body,actions){const modal=$('#modal');modal.innerHTML=`<div class="dialog-head"><div><h2 id="dialog-title">${title}</h2><p>${description}</p></div><button class="close-btn" data-action="close" aria-label="关闭弹窗">${icon('close')}</button></div><div class="dialog-body">${body}</div><div class="dialog-actions">${actions}</div>`;if(!modal.open)modal.showModal();}
function closeDialog(){if(busy)return;$('#modal').close();operation=null;}
function openChecks(){dialog('当前设备检查',`${current().name} · 示例检查结果`,`${checkList()}<div class="callout">${current().linked?'配置文件已归位，插件入口指向当前设备自己的配置。':'发现本机 FNS 配置仍为普通文件。接入会暂停 FNS，保留完整内容，归位并建立符号链接，再恢复原启用状态。'}</div><div class="tiny muted">设备身份、配置归属和插件实际加载分别检查。</div>`,`${button('关闭','close')}${current().linked?button('重新检查','recheck',{primary:true}):button('完成本机接入','onboard',{primary:true,name:'link'})}`);}
function openDiff(){dialog('本机与权威版本的差异',`${current().name} → 权威版本 v${authority().version}`,inlineDiff()+`<div class="scope-note">${changeCount()} 处变化。其他配置不在本次应用范围内。</div>`,`${button('返回','close')}${button('应用权威配置','apply',{primary:true,disabled:!current().linked||!state.sourceValid||!received()||changeCount()===0})}`);}
function openApply(force=false){
  if(!current().linked)return openChecks();
  if(!state.sourceValid)return sourceInfo();
  if(!received())return notify('先检查更新，接收发布记录与来源配置。');
  if(localDirty()&&!force)return openConflict();
  dialog('应用权威配置',`将 ${current().name} 的四组规则更新到 v${authority().version}`,inlineDiff()+`<div class="callout">应用时会保存恢复记录、暂停 FNS 并更新本机配置，随后恢复并核验加载结果。</div><p class="tiny muted">${force?'你已选择用权威版本替换本机未发布的规则。':'账号、Token、其他设置及符号链接归属继续保留。'}</p>`,`${button('取消','close')}${button('确认应用','apply-confirm',{primary:true,name:'download'})}`);
}
function openPublish(){
  if(!current().linked)return openChecks();
  if(!received()){dialog('先接收当前权威版本','核对最新差异后再发布','<div class="callout">当前设备尚未取得最新发布内容。先接收并比较，避免用旧配置覆盖其他设备的新修改。</div>',`${button('返回','close')}${button('接收更新','receive-before-publish',{primary:true})}`);return;}
  if(state.pending?.device===state.device)return retryPublish();
  dialog('发布本机配置为权威版本',`来源：${current().name} · 将发布 v${authority().version+1}`,inlineDiff(authority().rules,current().rules)+`<div class="callout">生成版本记录，并通过 Git 提交、推送。其他设备接收后，仍需在各自工作台应用。</div><p class="tiny muted">仅发布约定的四组规则。发布来源会明确记录为设备 ${state.device}。</p>`,`${button('取消','close')}${button('确认发布','publish-confirm',{primary:true,name:'upload',disabled:!localDirty()&&state.sourceValid&&rulesEqual(current().rules,authority().rules)})}`);
}
function openConflict(){dialog('先处理本机未发布的修改',`当前权威版本 v${authority().version} · ${current().name} 有本地修改`,`<div class="callout amber">应用权威版本会替换本机这四组规则。也可以保留本机修改，先检查差异后发布一个新版本。</div><h3 style="margin-bottom:10px">应用权威版本将产生的变化</h3>${inlineDiff()}`,`${button('稍后处理','close')}${button('保留本机，准备发布','publish')}${button('使用权威版本','apply-force',{primary:true})}`);}
function sourceInfo(){dialog('发布内容与版本记录不一致','需要来源设备重新发布',`<div class="callout red">${esc(state.devices[authority().source].name)} 在发布 v${authority().version} 后又修改了配置。这些修改尚未成为新的权威版本。</div><p class="tiny muted">本机暂不应用。来源设备完成重新发布并传递后，再检查更新。</p>`,button('知道了','close',{primary:true}));}
function addHistory(title,detail){current().history.unshift({title,detail});}
const wait = ms => new Promise(resolve=>setTimeout(resolve,ms));
function operationView(title,steps,index,{failed=false,done=false}={}){
  const body=steps.map((text,i)=>`<div class="operation-line ${i<index||done?'done':i===index?(failed?'failed':'active'):''}">${icon(i<index||done?'circle':i===index?(failed?'issue':'sync'):'clock')}<span>${text}</span><span class="operation-status">${i<index||done?'已完成':i===index?(failed?'失败':'进行中'):'等待'}</span></div>`).join('');
  dialog(title,'演示操作 · 不会改动真实文件',body+`<p class="operation-note">${failed?'发布版本已留在本机，可恢复连接后继续推送；远端权威版本未改变。':done?'本次演示已完成。可切换到另一台示例设备继续体验。':'请稍候，正在演示各阶段的状态。'}</p>`,failed?`${button('稍后重试','close')}${button('恢复连接并重试','retry-online',{primary:true})}`:done?button('完成','close',{primary:true}):'<span class="tiny muted">处理中…</span>');
  if(busy)$('#modal [data-action="close"]').disabled=true;
}
async function runApply(){
  if(busy)return;busy=true;const device=state.device,target=clone(authority());const steps=['核验权威版本与本机原文','保存本机恢复记录','暂停当前 FNS','更新四组同步规则','恢复 FNS 并核验加载'];
  for(let i=0;i<steps.length;i++){operationView('正在应用权威配置',steps,i);await wait(220);}
  const d=state.devices[device];d.rules=clone(target.rules);d.baseline=clone(target.rules);d.applied=target.version;d.received=target.version;d.history.unshift({title:'应用权威版本 v'+target.version,detail:'刚刚 · FNS 已重新加载（演示）'});busy=false;render();operationView('已应用 v'+target.version,steps,steps.length,{done:true});
}
async function runPublish(retry=false){
  if(busy)return;busy=true;
  if(!retry)state.pending={device:state.device,version:authority().version+1,rules:clone(current().rules)};
  const steps=['核验本机四组配置','生成权威版本记录','提交配置与版本记录','推送到 Git 远端'];
  for(let i=retry?3:0;i<steps.length;i++){operationView(`正在发布 v${state.pending.version}`,steps,i);await wait(260);}
  if(!state.online){busy=false;render();operationView('发布尚未传到远端',steps,3,{failed:true});return;}
  const p=state.pending;state.publication={version:p.version,source:p.device,time:'刚刚',rules:clone(p.rules)};state.sourceValid=true;const d=state.devices[p.device];d.applied=p.version;d.received=p.version;d.baseline=clone(p.rules);d.history.unshift({title:'发布权威版本 v'+p.version,detail:'刚刚 · 已推送到 Git 远端（演示）'});state.pending=null;busy=false;render();operationView('v'+p.version+' 已推送',steps,steps.length,{done:true});
}
function retryPublish(){dialog('继续推送已生成的版本',`待发布 v${state.pending.version}`,`<div class="callout amber">此版本已经在本机生成并提交。重试将继续推送同一版本。</div>`,`${button('稍后重试','close')}${button('重试推送','publish-retry',{primary:true})}`);}
async function runCheck(){
  if(busy)return;busy=true;notify('正在检查远端发布版本…');await wait(450);
  if(!state.online){busy=false;dialog('无法连接 Git 远端','本机配置保持原状','<div class="callout amber">本次未能确认远端版本。恢复连接后可以继续检查。</div>',`${button('关闭','close')}${button('恢复连接并检查','check-online',{primary:true})}`);return;}
  current().received=authority().version;if(state.sourceValid)addHistory('核验权威版本 v'+authority().version,'刚刚 · 发布记录与来源内容一致（演示）');busy=false;render();notify(state.sourceValid?'已接收并核验 v'+authority().version:'来源内容与发布记录不一致，请来源设备重新发布。');
}
async function onboard(){if(busy)return;busy=true;const steps=['确认 FNS 已配置并识别本机','暂停 FNS 并保留完整配置','归位配置、建立本机符号链接','恢复原启用状态并核验'];for(let i=0;i<steps.length;i++){operationView('正在接入当前设备',steps,i);await wait(230);}current().linked=true;addHistory('完成本机配置接入','刚刚 · 配置归位与链接检查通过（演示）');busy=false;render();operationView('本机接入完成',steps,steps.length,{done:true});}
document.addEventListener('click',async event=>{
  const target=event.target.closest('button');if(!target||target.disabled||busy)return;
  if(target.dataset.nav){view=target.dataset.nav;render();window.scrollTo({top:0});return;}
  if(target.dataset.device){state.device=target.dataset.device;render();notify(`已切换到示例设备 ${state.device} · ${current().name}`);return;}
  if(target.dataset.field){field=target.dataset.field;render();return;}
  const action=target.dataset.action;
  if(action==='reset'){reset(state.scenario);notify('演示状态已重置。');return;}
  if(action==='open-fns'){view='fns';render();return;}
  if(action==='checks')return openChecks();
  if(action==='recheck'){openChecks();notify('设备检查已完成（演示）。');return;}
  if(action==='close')return closeDialog();
  if(action==='check')return runCheck();
  if(action==='check-online'){state.online=true;closeDialog();return runCheck();}
  if(action==='publish')return openPublish();
  if(action==='receive-before-publish'){closeDialog();await runCheck();if(received()&&state.online)openPublish();return;}
  if(action==='publish-confirm')return runPublish();
  if(action==='publish-retry')return runPublish(true);
  if(action==='retry')return retryPublish();
  if(action==='retry-online'){state.online=true;return runPublish(true);}
  if(action==='apply')return openApply();
  if(action==='apply-force')return openApply(true);
  if(action==='apply-confirm')return runApply();
  if(action==='onboard')return onboard();
  if(action==='diff')return openDiff();
  if(action==='conflict')return openConflict();
  if(action==='source-info')return sourceInfo();
  if(action==='state')dialog('当前原型状态','全部为内存中的示例数据',`<pre class="state-code">${esc(JSON.stringify({layout,...state},null,2))}</pre>`,button('关闭','close'));
});
document.addEventListener('change',event=>{if(event.target.id==='scenario'&&!busy)reset(event.target.value);});
$('#modal').addEventListener('cancel',event=>{if(busy)event.preventDefault();});
const reviewUrl = new URL(location.href);
if(reviewUrl.searchParams.has('variant')){reviewUrl.searchParams.delete('variant');history.replaceState(null,'',reviewUrl);}
reset();
</script>
</body>
</html>
